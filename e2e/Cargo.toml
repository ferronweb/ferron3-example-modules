[package]
name = "e2e-example"
version = "0.1.0"
edition = "2021"
description = "End-to-end tests for Ferron 3 example modules (testcontainers)."
publish = false

[[test]]
name = "http_examples"
path = "tests/http_examples.rs"

[[test]]
name = "echo_server"
path = "tests/echo_server.rs"

# This crate is excluded from the workspace in the parent Cargo.toml so
# that `cargo test --workspace` in the workspace does not run the E2E tests
# (they require Docker and a built image).

[target.'cfg(unix)'.dev-dependencies]
nix = { version = "0.31.2", features = ["fs"] }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.13.2", default-features = false, features = ["http2", "rustls-no-provider", "cookies"] }
testcontainers = { version = "0.28.0", features = ["http_wait_plain", "reusable-containers"] }
futures-util = "0.3"
tempfile = "3"
glob = "0.3"
http = "1"
rustls = { version = "0.23", features = ["ring"] }
