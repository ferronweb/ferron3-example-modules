# Example Ferron configuration that enables all example modules.
# This file is used by the fixture binary and the E2E Dockerfile.

{
    # Example custom server: TCP echo on 9090
    echo_server {
        listen "0.0.0.0:9090"
    }
}

# Host block that exercises the HTTP example stages and log formatter.
example.com {
    root /var/www/ferron

    # Example HTTP header append (ferron-http-header-append)
    example_header hello-world

    # Example hello stage (ferron-http-hello)
    hello_path /hello
    hello_message "Hello from example modules!"

    # Example observability memory sink (ferron-observability-memory)
    # Uncomment to enable:
    # observability {
    #     provider memory
    #     memory {
    #         max_events 500
    #     }
    # }

    # Example TLS selfsigned (ferron-tls-selfsigned)
    # Uncomment to require TLS:
    # tls {
    #     provider selfsigned
    #     selfsigned {
    #         days 365
    #     }
    # }
}
