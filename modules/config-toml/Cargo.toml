[package]
name = "ferron-config-toml"
version = "0.1.0"
edition = "2021"
description = "Example Ferron configuration adapter that parses TOML (ferron-config-toml)."
license = "MIT OR Apache-2.0"

[dependencies]
async-trait = "0.1"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
notify = "8"
notify-debouncer-mini = "0.7"
tokio = { version = "1", features = ["sync"] }
rustc-hash = "2"
xxhash-rust = { version = "0.8", features = ["xxh3"] }

ferron-core = { git = "https://github.com/ferronweb/ferron", branch = "3.x" }

[dev-dependencies]
tempfile = "3"
