[package]
name = "ferron-dns-memory"
version = "0.1.0"
edition = "2021"
description = "Example Ferron DNS provider that keeps records in memory (ferron-dns-memory)."
license = "MIT OR Apache-2.0"

[dependencies]
async-trait = "0.1"
tokio = { version = "1", features = ["rt", "macros"] }

ferron-core = { git = "https://github.com/ferronweb/ferron", branch = "3.x" }
ferron-dns = { git = "https://github.com/ferronweb/ferron", branch = "3.x" }

[dev-dependencies]
rustc-hash = "2"
tokio = { version = "1", features = ["rt", "macros"] }
